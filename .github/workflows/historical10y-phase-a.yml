name: Historical 10Y Phase A Offline Validation

on:
  push:
    branches: [jra-historical-10y-backfill]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical10y-phase-a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase-a-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile offline historical modules
        run: python -m compileall -q collector/historical10y

      - name: Run Phase A unit tests
        run: python -m unittest discover -s collector/historical10y/tests -v

      - name: Reconcile existing 22 real races into canonical SQLite
        run: |
          mkdir -p historical10y-phase-a
          python collector/historical10y/reconcile_fixture.py \
            --fixture collector/fixtures/jra-real-historical-fixture-20260919-20261114.json \
            --db historical10y-phase-a/jra_historical_canonical_phase_a.db \
            --report historical10y-phase-a/phase-a-reconciliation.json

      - name: Prove no live source acquisition is part of Phase A
        run: |
          grep -q '"network_access": "NONE"' historical10y-phase-a/phase-a-reconciliation.json
          grep -q '"PHASE_A_FIXTURE_RECONCILIATION": "PASS"' historical10y-phase-a/phase-a-reconciliation.json

      - name: Prove JV-Link preflight fails closed off Windows without data acquisition
        run: |
          set +e
          python collector/historical10y/jvlink_preflight.py \
            --output historical10y-phase-a/jvlink-preflight-linux.json
          rc=$?
          set -e
          test "$rc" -eq 2
          grep -q '"status": "WINDOWS_REQUIRED"' historical10y-phase-a/jvlink-preflight-linux.json
          grep -q '"network_data_download": "NONE"' historical10y-phase-a/jvlink-preflight-linux.json
          grep -q '"jvopen_called": false' historical10y-phase-a/jvlink-preflight-linux.json
          grep -q '"jvrtopen_called": false' historical10y-phase-a/jvlink-preflight-linux.json

      - name: Prove missing Windows/contract evidence cannot promote the source gate
        run: |
          set +e
          python collector/historical10y/verify_jvlink_preflight.py \
            --preflight historical10y-phase-a/jvlink-preflight-linux.json \
            --output historical10y-phase-a/jvlink-preflight-gate-linux.json
          rc=$?
          set -e
          test "$rc" -eq 5
          grep -q '"JRA_VAN_BULK_SOURCE_GATE": "PARTIAL"' historical10y-phase-a/jvlink-preflight-gate-linux.json
          grep -q '"SOURCE_MANIFEST_READINESS": "PARTIAL"' historical10y-phase-a/jvlink-preflight-gate-linux.json
          grep -q '"smoke_test_ready": false' historical10y-phase-a/jvlink-preflight-gate-linux.json
          grep -q '"bulk_backfill_authorized": false' historical10y-phase-a/jvlink-preflight-gate-linux.json

      - name: Upload Phase A audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: historical10y-phase-a-offline
          path: historical10y-phase-a/
          if-no-files-found: error
