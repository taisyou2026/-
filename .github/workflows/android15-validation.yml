name: Android 15 SQLite Validation

on:
  push:
    branches: [main, jra-runtime-capability-gate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android15:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Build validation APKs and lint
        run: |
          set -euo pipefail
          gradle --no-daemon clean lintDebug assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android 15 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/run_android15.sh

      - name: Stage APK artifacts
        if: always()
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cp app/build/outputs/apk/debug/app-debug.apk HANSHIN_EDGE_RUNTIME_DEBUG.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk HANSHIN_EDGE_RUNTIME_ANDROIDTEST.apk
          sha256sum HANSHIN_EDGE_RUNTIME_DEBUG.apk HANSHIN_EDGE_RUNTIME_ANDROIDTEST.apk > apk-sha256.txt
          test -s collector/fixtures/jra-real-historical-fixture-20260919-20261114.json
          test -s collector/fixtures/jra-real-historical-fixture-summary.json
          cp collector/fixtures/jra-real-historical-fixture-summary.json real-fixture-summary.json
          sha256sum collector/fixtures/jra-real-historical-fixture-20260919-20261114.json > fixture-sha256.txt
          ls -lh HANSHIN_EDGE_RUNTIME_DEBUG.apk HANSHIN_EDGE_RUNTIME_ANDROIDTEST.apk apk-sha256.txt real-fixture-summary.json fixture-sha256.txt

      - name: Upload Android 15 runtime validation evidence and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-runtime-capability-validation
          path: |
            *test.txt
            *reopen.txt
            public-harness-report.json
            native-readiness-runtime.json
            all-venue-runtime-test.txt
            real-fixture-replay.json
            settlement-restart.json
            real-fixture-summary.json
            fixture-sha256.txt
            HANSHIN_EDGE_RUNTIME_DEBUG.apk
            HANSHIN_EDGE_RUNTIME_ANDROIDTEST.apk
            apk-sha256.txt
          if-no-files-found: warn
