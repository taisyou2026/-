name: Android 15 SQLite Validation

on:
  push:
    branches: [main, jra-runtime-capability-gate]
  workflow_dispatch:
    inputs:
      mode:
        description: Regression or opt-in actual read-only observation
        type: choice
        default: regression
        options: [regression, real_prospective]

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'real_prospective' && 'real-prospective-readonly' || format('android15-{0}', github.ref) }}
  cancel-in-progress: ${{ inputs.mode != 'real_prospective' }}

jobs:
  android15:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.mode == 'real_prospective' && 185 || 45 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Fundamental feature readiness focused test
        run: |
          set -euo pipefail
          python3 -m unittest -v collector.test_fundamental_feature_readiness 2>&1 | tee fundamental-feature-readiness-test.txt
          python3 collector/audit_fundamental_feature_readiness.py --output fundamental-feature-readiness.json
          python3 - <<'PY'
          import json
          r=json.load(open('fundamental-feature-readiness.json',encoding='utf-8'))
          assert r['race_count']==22
          assert r['active_runner_count']==307
          assert r['ready_for_f0_fields']==[]
          assert r['F0_FEATURE_READINESS']=='BLOCKED_ASOF_EVIDENCE'
          assert r['F0_MODEL_STATUS']=='NOT_AVAILABLE'
          assert r['FORMAL_PAPER_BUY']=='BLOCKED'
          assert r['REAL_MONEY']=='BLOCKED'
          assert r['AUTO_REAL_BET']=='DISABLED'
          print('FUNDAMENTAL_FEATURE_READINESS_AUDIT=PASS')
          PY
          sha256sum fundamental-feature-readiness.json > fundamental-feature-readiness-sha256.txt

      - name: Build validation APKs and lint
        run: |
          set -euo pipefail
          gradle --no-daemon clean lintDebug assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Android 15 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/run_android15_mode.sh
        env:
          OBSERVATION_MODE: ${{ inputs.mode || 'regression' }}

      - name: Stage APK artifacts
        if: always()
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          cp app/build/outputs/apk/debug/app-debug.apk JRA_EDGE_DEBUG.apk
          cp app/build/outputs/apk/debug/app-debug.apk HANSHIN_EDGE_RUNTIME_DEBUG.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk JRA_EDGE_ANDROIDTEST.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk HANSHIN_EDGE_RUNTIME_ANDROIDTEST.apk
          sha256sum JRA_EDGE_DEBUG.apk JRA_EDGE_ANDROIDTEST.apk > apk-sha256.txt
          test -s collector/fixtures/jra-real-historical-fixture-20260919-20261114.json
          test -s collector/fixtures/jra-real-historical-fixture-summary.json
          cp collector/fixtures/jra-real-historical-fixture-summary.json real-fixture-summary.json
          sha256sum collector/fixtures/jra-real-historical-fixture-20260919-20261114.json > fixture-sha256.txt
          ls -lh HANSHIN_EDGE_RUNTIME_DEBUG.apk HANSHIN_EDGE_RUNTIME_ANDROIDTEST.apk apk-sha256.txt real-fixture-summary.json fixture-sha256.txt

      - name: Upload Android 15 runtime validation evidence and APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android15-runtime-capability-validation
          path: |
            JRA_EDGE_DEBUG.apk
            JRA_EDGE_ANDROIDTEST.apk
            live-prospective-probe.json
            real-prospective-evidence/
            real-prospective-test.txt
            real-prospective-export-error.txt
            launcher-*.txt
            *test.txt
            *reopen.txt
            public-harness-report.json
            native-readiness-runtime.json
            all-venue-runtime-test.txt
            real-fixture-replay.json
            settlement-restart.json
            real-fixture-summary.json
            fixture-sha256.txt
            fundamental-feature-readiness.json
            fundamental-feature-readiness-test.txt
            fundamental-feature-readiness-sha256.txt
            HANSHIN_EDGE_RUNTIME_DEBUG.apk
            HANSHIN_EDGE_RUNTIME_ANDROIDTEST.apk
            apk-sha256.txt
          if-no-files-found: warn
